<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <path d="M34,40
           C20,40 12,48 10,60
           C8,74 14,88 26,94
           C34,98 42,94 44,84
           C46,76 52,72 64,72
           C76,72 82,76 84,84
           C86,94 94,98 102,94
           C114,88 120,74 118,60
           C116,48 108,40 94,40
           C84,36 74,34 64,34
           C54,34 44,36 34,40 Z"
        fill="#E4032B"/>

  <!-- shoulder button pips -->
  <rect x="18" y="36" width="22" height="8" rx="4" fill="#12182B"/>
  <rect x="88" y="36" width="22" height="8" rx="4" fill="#12182B"/>

  <!-- D-pad -->
  <rect x="20" y="63" width="16" height="6" rx="1.5" fill="#12182B"/>
  <rect x="25" y="58" width="6" height="16" rx="1.5" fill="#12182B"/>

  <!-- face buttons -->
  <circle cx="100" cy="58" r="4" fill="#12182B"/>
  <circle cx="100" cy="74" r="4" fill="#12182B"/>
  <circle cx="92" cy="66" r="4" fill="#12182B"/>
  <circle cx="108" cy="66" r="4" fill="#12182B"/>

  <!-- touchpad: same red as body, black lining to define the boundary -->
  <rect x="46" y="43" width="36" height="23" rx="5" fill="#E4032B" stroke="#12182B" stroke-width="2.4"/>

  <!-- readout -->
  <text x="64" y="58" font-family="Arial, Helvetica, sans-serif" font-weight="800"
        font-size="14" fill="#12182B" text-anchor="middle">5h</text>

  <!-- subtle texture dots, black to stay visible on red -->
  <circle cx="54" cy="62" r="1.1" fill="#12182B"/>
  <circle cx="59" cy="62" r="1.1" fill="#12182B"/>
  <circle cx="69" cy="62" r="1.1" fill="#12182B"/>
  <circle cx="74" cy="62" r="1.1" fill="#12182B"/>
</svg>
